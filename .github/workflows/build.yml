name: Build VoiceRLyn Native NDK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c

      - name: Build arm64-v8a (Untuk sistem 64-bit)
        run: |
          mkdir -p build_arm64
          cd build_arm64
          cmake -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-29 \
                ../src
          make
          
      - name: Build armeabi-v7a (Untuk kompatibilitas 32-bit)
        run: |
          mkdir -p build_arm32
          cd build_arm32
          cmake -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=armeabi-v7a \
                -DANDROID_PLATFORM=android-29 \
                ../src
          make

      - name: Siapkan Folder Output
        run: |
          mkdir -p output/lib64/soundfx
          mkdir -p output/lib/soundfx
          cp build_arm64/libvoicerlyn.so output/lib64/soundfx/
          cp build_arm32/libvoicerlyn.so output/lib/soundfx/

      - name: Upload Hasil Kompilasi (.so)
        uses: actions/upload-artifact@v4
        with:
          name: VoiceRLyn_Compiled_Libs
          path: output/
